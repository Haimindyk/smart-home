name: Yachad
options:
  bundleIdPrefix: com.haimindyk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Yachad/Config/Secrets.xcconfig
  Release: Yachad/Config/Secrets.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.23.0

targets:
  Yachad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Yachad
        excludes:
          - "Config/Secrets.xcconfig*"
    info:
      path: Generated/Yachad-Info.plist
      properties:
        CFBundleDisplayName: יחד
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "כדי לסרוק קוד QR של הזמנה לאזור משותף"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.haimindyk.yachad
            CFBundleURLSchemes: [yachad]
        UIBackgroundModes: [remote-notification]
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haimindyk.yachad
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_ENTITLEMENTS: Yachad/Yachad.entitlements
    dependencies:
      - package: Supabase
        product: Supabase

schemes:
  Yachad:
    build:
      targets:
        Yachad: all
    run:
      config: Debug
    archive:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
