name: SmartHomeWellness
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
packages:
  WellnessCore:
    path: ../Core
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SmartHomeWellness:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Wellness
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: הצגת פעילות וייבוא אימונים שתבחר מ־Apple Health לחשבון שלך. לא נכתוב נתונים ל־Apple Health.
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_PUBLIC_KEY: $(SUPABASE_PUBLIC_KEY)
    entitlements:
      path: Config/Wellness.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haimindyk.smarthome.wellness
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: WellnessCore
    scheme:
      testTargets: []
