name: SmartHomeWellness
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: he
  deploymentTarget:
    iOS: '17.0'
packages:
  WellnessCore:
    path: ../Core
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SmartHomeWellness:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Wellness
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthUpdateUsageDescription: האפליקציה לא כותבת נתונים ל־Apple Health; ההרשאה נדרשת על ידי Apple עבור גישת HealthKit לקריאה בלבד.
        NSHealthShareUsageDescription: הצגת פעילות וייבוא אימונים שתבחר מ־Apple Health לחשבון שלך. לא נכתוב נתונים ל־Apple Health.
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_PUBLIC_KEY: $(SUPABASE_PUBLIC_KEY)
    entitlements:
      path: Config/Wellness.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haimindyk.smarthome.wellness
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Target-level default is 1,2 and overrides the project-level value; iPhone only.
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      - package: WellnessCore
    scheme:
      testTargets: [SmartHomeWellnessUITests]
  SmartHomeWellnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haimindyk.smarthome.wellness.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SmartHomeWellness
    dependencies:
      - target: SmartHomeWellness
