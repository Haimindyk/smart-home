name: Wellness checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r ml/requirements-cpu.lock
      - run: PYTHONPATH=ml python -m unittest discover -s ml/tests -v
      - run: PYTHONPATH=ml python -m wellness.smoke "$RUNNER_TEMP/wellness-model-smoke"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-public-placeholder
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:wellness:ui
      - run: pnpm dlx deno@2.9.6 check supabase/functions/wellness-training/index.ts supabase/functions/wellness-ai/index.ts supabase/functions/health-account/index.ts supabase/functions/health-maintenance/index.ts
