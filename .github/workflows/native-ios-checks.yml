name: Native iOS checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/native-ios-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test portable authentication and import logic
        run: swift test --package-path ios/Core
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate the iPhone project
        working-directory: ios/App
        run: xcodegen generate
      - name: Build native SwiftUI and HealthKit for iOS Simulator
        working-directory: ios/App
        run: >-
          xcodebuild -project SmartHomeWellness.xcodeproj
          -scheme SmartHomeWellness -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/WellnessDerivedData"
          CODE_SIGNING_ALLOWED=NO build
      - name: Test native screens with synthetic services
        working-directory: ios/App
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if "iPhone" in x["name"]))')
          xcodebuild -project SmartHomeWellness.xcodeproj \
            -scheme SmartHomeWellness -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/WellnessDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/WellnessUI.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Export native screenshots
        if: always()
        continue-on-error: true
        run: |
          if [ -d "$RUNNER_TEMP/WellnessUI.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/WellnessUI.xcresult" --output-path "$RUNNER_TEMP/WellnessScreenshots"
          fi
      - name: Save native UI test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-ui-results
          path: |
            ${{ runner.temp }}/WellnessUI.xcresult
            ${{ runner.temp }}/WellnessScreenshots
          retention-days: 3
  # Validates the release toolchain (Xcode 27, cloud-managed signing, export) without uploading anything.
  release-build-check:
    runs-on: xcode-27
    environment: beta
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Fastlane
        run: |
          rm -f Gemfile.lock
          bundle install
        working-directory: ios/fastlane
      - name: Build and sign (no upload)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
          GITHUB_RUN_NUMBER: "900"
          FASTLANE_SETUP_CI: "1"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bundle exec fastlane build_check
        working-directory: ios/fastlane
