name: Native iOS checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/native-ios-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test portable authentication and import logic
        run: swift test --package-path ios/Core
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate the iPhone project
        working-directory: ios/App
        run: xcodegen generate
      - name: Build native SwiftUI and HealthKit for iOS Simulator
        working-directory: ios/App
        run: >-
          xcodebuild -project SmartHomeWellness.xcodeproj
          -scheme SmartHomeWellness -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/WellnessDerivedData"
          CODE_SIGNING_ALLOWED=NO build
      # The simulator UI tests (xcodebuild test, ~12 min) are run locally before every merge and are not part of the PR checks.

  # Validates the release toolchain (Xcode 27, cloud-managed signing, export) without uploading anything.
  release-build-check:
    runs-on: xcode-27
    environment: beta
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Fastlane
        run: |
          rm -f Gemfile.lock
          bundle install
        working-directory: ios/fastlane
      - name: Build and sign (no upload)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
          GITHUB_RUN_NUMBER: "900"
          FASTLANE_SETUP_CI: "1"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bundle exec fastlane build_check
        working-directory: ios/fastlane
