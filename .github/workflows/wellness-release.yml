name: Release Wellness backend after merge
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: wellness-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm dlx deno@2.9.6 check supabase/functions/wellness-training/index.ts supabase/functions/wellness-ai/index.ts supabase/functions/health-account/index.ts supabase/functions/health-maintenance/index.ts
      - name: Check release configuration
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Missing SUPABASE_DB_URL production secret'; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN production secret'; exit 1; }
          test -n "$PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF production variable'; exit 1; }
      - name: Apply the additive migration atomically
        env:
          PGDATABASE: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: psql -X --set=ON_ERROR_STOP=1 --single-transaction --file=scripts/release-wellness.sql
      - name: Release only the functions from the merge commit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: pnpm dlx supabase@3.0.0 functions deploy wellness-training wellness-ai health-account health-maintenance --remote="$PROJECT_REF" --use-api --no-verify-jwt --yes
