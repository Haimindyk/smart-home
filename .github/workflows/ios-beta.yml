name: iOS Beta (TestFlight)

# Runs only as a consequence of a merge into main (or a manual dispatch from main).
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-beta
  cancel-in-progress: false # never cancel a mid-flight TestFlight upload

jobs:
  build-and-upload:
    name: Build, sign, upload to TestFlight
    if: github.ref == 'refs/heads/main'
    # GitHub-hosted Apple-silicon macOS image with Xcode 27. The Intel self-hosted Mac cannot run Xcode 27,
    # and iOS 27 devices need an iOS 27 SDK build (Apple also requires it from April 2027).
    runs-on: xcode-27
    environment: beta
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test portable logic
        run: swift test --package-path ios/Core
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Fastlane
        run: |
          rm -f Gemfile.lock
          bundle install
        working-directory: ios/fastlane
      - name: Build & upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
          FASTLANE_SETUP_CI: "1"
          DEV_CERT_P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          DEV_CERT_P12_PASSWORD: ${{ secrets.DEV_CERT_P12_PASSWORD }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bundle exec fastlane beta
        working-directory: ios/fastlane
