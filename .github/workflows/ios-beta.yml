name: iOS Beta (TestFlight)

# Runs only as a consequence of a merge into main (or a manual dispatch from main).
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-beta
  cancel-in-progress: false # never cancel a mid-flight TestFlight upload

jobs:
  build-and-upload:
    name: Build, sign, upload to TestFlight
    if: github.ref == 'refs/heads/main'
    # Same self-hosted macOS runner used by bruto-neto (GitHub-hosted macOS bills at 10x).
    runs-on: [self-hosted, macOS]
    environment: beta
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode and XcodeGen
        run: |
          xcode-select -p
          xcodegen --version || brew install xcodegen
      - name: Test portable logic
        run: swift test --package-path ios/Core
      # System Ruby (/usr/bin) matches the gems; Homebrew's Ruby would shadow it.
      - name: Install Fastlane
        run: |
          export PATH="/usr/bin:$PATH"
          bundle install --path vendor/bundle
        working-directory: ios/fastlane
      - name: Unlock keychain for non-interactive codesign
        run: |
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db
        env:
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      - name: Build & upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          export PATH="/usr/bin:$PATH"
          bundle exec fastlane beta
        working-directory: ios/fastlane
